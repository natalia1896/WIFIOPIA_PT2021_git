step6b_fc_geometry:
  folder_name: step6b_fc_geometry
  include_bad_rows: true  # retained for compatibility; no automatic is_bad gate
  rest_min_duration_sec: 60.0
  rest_segments_final_csv: null  # defaults to out/behavior_review/rest_segments_final.csv
  rest_shadow_masks_by_stem_csv: null  # includes masks even when there are zero USE windows
  use_manual_registration_overrides: true
  strict_missing_declared_masks: true
  continue_on_error: false
  selection:
    unassigned_label: UNASSIGNED
    fail_on_required_selection_problem: false
  broad_atlas:
    parent_acronym: Isocortex
    save_original_to_broad_mapping: true
    roi_refinements:
      MO:
        mode: split
        children:
        - MOp
        - MOs
        unmatched_policy: error
  technical_sources:
    bad_auto: true
    bregma: true
    rescue_shadow: true
    step4_shadow_union_manual: false
  technical_geometry:
    common_brain_edge_erosion:
      enabled: true
      radius_px: 20
  # Hemorrhage uses ONE canonical source, unconditionally:
  # out/step2_masks/masks/<stem>/hemorrhage_manual.npy
  # No OR with damage_assessment and no legacy pathology_sources switches.
  hemisphere:
    lesion_side: right
    per_mouse_lesion_side: {}
    ml_positive_label: null
    midline_exclusion_px: 12
    homotopic_map_hemisphere: lesion
    global_analysis_hemisphere: healthy
  side_consistency_qc:
    enabled: true
    fail_on_swap: true
    min_expected_minus_opposite: 0.2
  roi_geometry:
    boundary_exclusion_canonical_px: 2
    save_refspace_equivalent_buffer_qc: true
    fill_internal_zero_holes_before_buffer: true
    internal_hole_background_connectivity: 4
    max_internal_zero_hole_area_px: null
    max_internal_nonzero_hole_area_px: 5
  roi_thresholds:
    min_technical_coverage: 0.4
    min_homotopic_technical_coverage: 0.4
    min_global_technical_coverage: 0.4
    use_absolute_coverage_gate: false
    cohort_relative:
      enabled: true
      reference_stat: median
      min_relative_fraction: 0.6
      max_relative_fraction: 1.25
      upper_bound_mode: flag
    min_stem_usable_coverage: 0.5
    min_pixels: 500
    min_mouse_fraction_per_group: 0.65
    require_all_groups: true
  qc:
    organize_png_by_mask_set: true
    save_pathology_png_only_if_nonzero: true
    save_shadow_png_only_if_nonzero: true
    save_canonical_mask_pngs: true
    save_cohort_frequency_maps: true
    save_reference_atlas_repair_png: true
  primary_roi_mask_set: stroke_longitudinal
  mask_sets:
    stroke_longitudinal:
      enabled: true
      required: true
      whole_hemisphere_only: false
      require_assigned_experimental_group: true
      slot_policy: per_stem
      min_stems: 2
      expected_comparison_groups: [Control, Awake_PT, Iso_PT]
      spatial_masks:
      - homotopic
      - global_healthy
      global_analysis_hemisphere: healthy
      thresholds:
        min_pixels: 400
        min_stem_usable_coverage: 0.4  # REVIEW: inherited A threshold; now applies to B; do not use for final results until agreed
        cohort_relative:
          min_relative_fraction: 0.45
      slots:
        baseline:
          match:
            exp_day: Before-PT
            state: Awake
            protocol:
              regex: (?i)rest[-_ ]?state
        post_1_5h:
          match:
            exp_day: 1-5h-PT
            state: Awake
            protocol:
              regex: (?i)rest[-_ ]?state
        day1:
          match:
            exp_day: 1d-PT
            state: Awake
            protocol:
              regex: (?i)rest[-_ ]?state
        day3:
          match:
            exp_day: 3d-PT
            state: Awake
            protocol:
              regex: (?i)rest[-_ ]?state
      per_mouse_slot_overrides:
        m12:
          baseline:
            match:
              exp_day: Day-PT
              state: Awake
              protocol:
                regex: (?i)rest[-_ ]?state
    prestroke_stability:
      enabled: true
      required: false
      whole_hemisphere_only: true
      require_assigned_experimental_group: true  # provisional: previous experimental-group cohort
      slot_policy: all_slots
      spatial_masks:
      - homotopic
      - global_healthy
      - bilateral
      global_analysis_hemisphere: both
      thresholds:
        min_pixels: 100
        min_stem_usable_coverage: 0.4  # REVIEW: inherited A threshold; now applies to B
        cohort_relative:
          min_relative_fraction: 0.45
          max_relative_fraction: 1.2
          upper_bound_mode: flag
      slots:
        before:
          match:
            exp_day: Before-PT
            state: Awake
            protocol:
              regex: (?i)rest[-_ ]?state
        daypt_awake:
          match:
            exp_day: Day-PT
            state: Awake
            protocol:
              regex: (?i)rest[-_ ]?state
    daypt_anesthesia:
      enabled: true
      required: false
      whole_hemisphere_only: true
      require_assigned_experimental_group: false  # UNASSIGNED permitted
      slot_policy: one_of  # Awake OR Iso per mouse, never an intersection
      expected_comparison_groups: [Awake, Iso]
      spatial_masks:
      - homotopic
      - global_healthy
      - bilateral
      global_analysis_hemisphere: both
      thresholds:
        min_pixels: 100
        min_stem_usable_coverage: 0.4  # REVIEW: inherited A threshold; now applies to B
        cohort_relative:
          min_relative_fraction: 0.45
          max_relative_fraction: 1.2
          upper_bound_mode: flag
      slots:
        daypt_awake:
          match:
            exp_day: Day-PT
            state: Awake
            protocol:
              regex: (?i)rest[-_ ]?state
        daypt_iso:
          match:
            exp_day: Day-PT
            state: Iso
            protocol:
              regex: (?i)rest[-_ ]?state
functional_connectivity:
  folder_name: step7_functional_connectivity
  mask_sets:
  - stroke_longitudinal
  - prestroke_stability
  - daypt_anesthesia
  rest_segments_csv:
  build_rest_segments_if_missing: false
  expected_segment_sec: 60.0
  # Consecutive full 60-second windows for Iso (not REST Finalizer windows).
  anesthesia_windows:
    state: Iso
    mode: consecutive_nonoverlapping
    duration_sec: 60.0
    start_sec: 0.0
    incomplete_tail: discard
    require_behavior_rest_qc: false
  temporal:
    detrend_enabled: true
    detrend_type: linear
    filter_enabled: true
    low_hz: 0.08
    high_hz: 0.4
    order: 4
    synthetic_odd_pad_sec: 20.0
    variance_epsilon: 1.0e-12
    filter_type: bandpass
    trim_left_sec: 2.0
    trim_right_sec: 2.0
  spatial:
    scale: 0.5
    signal_resize: mask_aware_area
    min_valid_fraction: 0.5
  homotopic:
    require_same_analysis_roi: true
    mutual_nearest_partner: true
    fisher_clip: 0.999999
  global:
    both_hemispheres_mode: separate_hemispheres
    correlation_block_size: 512
    fisher_clip: 0.999999
    min_pool_pixels: 2
  final_grid_qc:
    min_roi_pixels: 5
    min_homotopic_pairs: 5
    min_final_grid_coverage_fraction: 0.25
  output:
    overwrite: false
    save_geometry: true
    save_segment_maps: true
    save_stem_maps: true
    save_qc_png: true
    save_roi_traces_one_mouse: true
    save_roi_traces_batch: false
  qc:
    map_percentiles:
    - 2.0
    - 98.0
    trace_rois:
  batch:
    continue_on_error: true
  rest_variant: with_rest
  variants:
    selected:
    - hbt_bandpass
    - hbt_lowpass
    - hbt_vreg_bandpass
    - hbt_vreg_lowpass
    definitions:
      hbt_bandpass:
        signal: dcHbT
        filter_type: bandpass
      hbt_lowpass:
        signal: dcHbT
        filter_type: lowpass
      hbt_vreg_bandpass:
        signal: dcHbT_vreg
        filter_type: bandpass
      hbt_vreg_lowpass:
        signal: dcHbT_vreg
        filter_type: lowpass
  active_variant_id: hbt_bandpass
  whole_cortex_summary:
    enabled: true
    save_stem_table: true
    save_mouse_table: true
    homotopic:
      enabled: true
    global:
      enabled: true
      save_sides_when_both: true
      save_bilateral_when_both: true
    qc:
      min_valid_homotopic_pairs: 1
      min_valid_gbc_pixels: 1
damage_assessment:
  folder_name: damage_assessment
  annotator: user

  input:
    baseline:
      policy: match
      match:
        exp_day: Day-PT
        protocol: Rest-state

    poststroke:
      match:
        exp_day:
          - 1-5h-PT
          - 1d-PT
          - 3d-PT
          - PT
        protocol: Rest-state

    use_manual_registration_overrides: true
    resize_brain_mask_if_needed: true

  output:
    masks_folder: masks
    diff_maps_folder: diff_maps
    previews_folder: previews
    tables_folder: tables
    index_name: damage_index.csv
    review_log_name: damage_review.csv
    error_log_name: damage_errors.csv

  batch:
    filters: null
    include_bad: false
    continue_on_error: true

  manual_gui:
    enabled: true
    helpers_folder: manual_gui_helpers
    tables_folder: tables
    gui_index_name: damage_gui_index.csv
    review_log_name: damage_manual_review.csv
    error_log_name: damage_manual_gui_errors.csv

    selection:
      require_unique_baseline: true

    raw_layers:
      wavelengths:
        - '505'
        - '656'
      normalization: mean_in_brain

      mean_images:
        enabled: true
        frame_stride: 1
        max_frames_per_wavelength: null
        cache_folder: raw_mean_cache
        overwrite_cache: false

    # Выбор фильмов 505, 656 или обоих в Napari
    raw_movie:
      enabled: true
      wavelengths:
        - '505'
        - '656'
      colormap: gray
      load_mode: on_demand

    # Покадровый HbT из processed Zarr для всех дней
    hbt_movie:
      enabled: true
      exp_days: []
      signal: dcHbT
      colormap: turbo

    # RUN = все интервалы вне размеченного REST
    run_sd:
      enabled: true
      annotations_path: null
      signal: dcHbT
      allow_signal_fallback: true
      fallback_signals:
        - dcHbT_gsub
      interval_source: complement_of_rest
      min_run_duration_sec: 2.0
      save_segment_maps: true
      aggregation: sample_weighted_segment_sd

    homotopic:
      # Загрузка готовых корреляционных карт Step 7
      authoritative:
        enabled: true
        folder_name: step7_functional_connectivity
        rest_variant: with_rest
        variant_id: hbt_lowpass
        mask_set: stroke_longitudinal
        subset_output_key: null
        display_units: pearson_r
        save_resized_z: true
        show_gbc: false

      # Повторный расчёт корреляций отключён
      full_preview:
        enabled: false

    # Геморрагия не используется
    hemorrhage:
      enabled: false

    display:
      percentiles:
        - 2.0
        - 98.0
      percentiles_use_brain_mask: true
      default_visible_layer: raw_505
      layer_opacity: 1.0

      colormaps:
        raw: gray
        diff_signed: coolwarm
        run_sd: turbo
        homotopic: turbo

    review:
      preload_existing_lesion: true
      save_empty_mask: false
      lesion_edge_color: yellow
      lesion_face_color:
        - 1.0
        - 1.0
        - 0.0
        - 0.12
      lesion_edge_width: 2.0
      skip_reviewed: false

    batch:
      continue_on_error: true
hemorrhage_reference_review:
  folder_name: hemorrhage_stem_review
  output_csv: hemorrhage_stem_review.csv
  wavelength: '505'
  postpt_exp_days:
  - 1-5h-PT
  - 1d-PT
  - 3d-PT
  baseline_exp_day_preference:
  - Day-PT
  - Before-PT
  baseline_match_same_state: true
  baseline_match_same_protocol: true
  baseline_allow_relaxed_match: true
  display:
    percentiles:
    - 1
    - 99
    shared_contrast: true
    window_width: 1450
    window_height: 850
  batch:
    skip_reviewed: true
    filters: {}
statistics:
  spreading_depolarization:
    groups:
      Contr:
      - m8
      - m12
      - m14
      - m24
      - m31
      Awake:
      - m15
      - m19
      - m21
      - m23
      - m26
      Iso:
      - m10
      - m13
      - m16
      - m17
      - m20
      - m27
      - m30

step_spontaneous_hemodynamics:
  folder_name: step_spontaneous_hemodynamics
  rest_variant: with_rest       # with_rest | without_rest; selects matching Step6b products
  mask_set: daypt_anesthesia
  signal: dcHbT
  rois: [MOp, MOs, SS, RSP]

  segments:
    primary_sec: 60.0
    duration_tolerance_sec: 0.75
    rest_segments_final_csv: null  # default: <out_root>/behavior_review/rest_segments_final.csv
    # with_rest: Awake uses ACCEPTED final REST only; Iso uses consecutive full 60-s windows.
    # without_rest: Awake and Iso both use consecutive full 60-s windows.

  spatial:
    scale: 0.50
    signal_resize: mask_aware_area
    min_valid_fraction: 0.50
  preprocessing:
    detrend_enabled: true
    detrend_type: linear
    variance_epsilon: 1.0e-12

  spectral:
    method: periodogram
    window: hann
    reference_band_hz: [0.05, 0.50]
    max_saved_frequency_hz: 0.50
    min_roi_pixels_fc: 5
    pixel_chunk_size: 2048  # pixelwise Hann PSD, then arithmetic mean for ROI / whole brain
    bands:
      0p05_0p10: [0.05, 0.10]
      0p11_0p20: [0.11, 0.20]
      0p21_0p40: [0.21, 0.40]  # NEW
      0p08_0p40: [0.08, 0.40]

  relative_power_maps:
    enabled: true
    bands:
      0p05_0p10: [0.05, 0.10]
      0p11_0p20: [0.11, 0.20]
      0p21_0p40: [0.21, 0.40]  # NEW
      0p08_0p40: [0.08, 0.40]
    reference_band_hz: [0.05, 0.50]
    pixel_chunk_size: 2048
    min_group_n_per_pixel: 2
    save_difference_map: true     # Iso-minus-Awake contrast

  correlations:
    enabled: true
    filter_type: lowpass         # bandpass | lowpass
    band_hz: [0.08, 0.40]        # used ONLY for bandpass
    lowpass_high_hz: 0.40        # used ONLY for lowpass; no high-pass component
    order: 4
    synthetic_odd_pad_sec: 30.0 # SciPy odd extension while filtering full 60-s fragment
    trim_left_sec: 0.0          # seconds to discard AFTER filtering, for correlations only
    trim_right_sec: 0.0         # can be different from left; PSD/maps still use full 60 s
    # left, right, bilateral_trace_mean; both sides use Step6b per-stem bilateral canonical homotopic pair masks.
    # Pearson r -> Fisher z -> mouse-first.

  output:
    overwrite: false
    save_segment_spectra_long: true
  batch:
    continue_on_error: true
